name: CI

# Runs on every push to a pull request and to main, and on every group the
# merge queue builds: test, lint, the API tier of the end-to-end harness with
# its checkpoints, test-e2e, and the fast UI check, snapshots-smoke, each named
# for its make target (docs/ci.md "The checks and their make targets"). The
# slow, full-fidelity snapshots check lives in snapshots.yml, which runs on
# push to main and for a pull request only once it is ready for review; the
# main ruleset requires all five, with pr-title.yml's title check, at a pull
# request's head before it merges, and again on the merge queue's group before
# it lands on main (docs/ci.md "The merge queue"). A pull request into main,
# outside a stack, that touches only documentation runs lint alone here: the
# changes job decides, and every other job here is skipped, which a required
# check counts as passed
# (docs/ci.md "Docs-only pull requests"). Below the top of a stack, test and
# lint run as ever, test-e2e runs its scenarios without comparing checkpoints,
# and snapshots-smoke passes saying it skipped (docs/ci.md "Stacked pull
# requests").
on:
  push:
    branches: [main]
  pull_request:
  merge_group:

# A new push to a pull request cancels that pull request's run still going, so
# a superseded commit stops holding macOS runners, of which the account runs
# five at once. Every push to main and every merge queue group keeps its own
# run (the run id is its group), so a push to a pull request never cancels a
# queued group's run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Whether this pull request touches only documentation nothing builds,
    # tests or runs (scripts/docs-only.sh), which test, test-e2e and
    # snapshots-smoke read to skip themselves. Only a pull request is ever
    # docs-only: a push to main, and any other event, runs everything. The
    # checkout is the pull request merged into its base, so its first parent is
    # the base and the diff between them is what the merge would change. Only a
    # pull request outside a stack may be docs-only, and the same job says
    # whether a stack lets this run skip the screenshot tests
    # (scripts/stack-checks.sh). That skip holds only when this job succeeded,
    # and only in a run's first attempt: rerunning one job keeps this job's
    # first answer, so each reader checks the attempt too. Should this job
    # fail, the others see no answer and run.
    runs-on: ubuntu-latest
    outputs:
      docs-only: ${{ steps.classify.outputs.docs-only || 'false' }}
      screenshots: ${{ steps.stack.outputs.screenshots || 'run' }}
      screenshots-reason: ${{ steps.stack.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
      - name: Read the pull request's place in its stack
        id: stack
        if: github.event_name == 'pull_request'
        run: |
          decision="$(scripts/stack-checks.sh "$GITHUB_EVENT_NAME" "$GITHUB_RUN_ATTEMPT" "$GITHUB_EVENT_PATH")"
          echo "$decision"
          echo "$decision" >> "$GITHUB_OUTPUT"
      - name: Classify the change
        id: classify
        if: steps.stack.outputs.docs-only-allowed == 'true'
        run: |
          docs_only="$(scripts/docs-only.sh HEAD^1 HEAD)"
          echo "Docs-only: $docs_only"
          echo "docs-only=$docs_only" >> "$GITHUB_OUTPUT"

  test:
    # The package targets macOS 26, so it needs the Xcode 26 SDK that the
    # macos-26 image ships. Older images cannot build it.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/select-xcode
      - uses: ./.github/actions/swiftpm-cache
        with:
          name: test
      - name: Package.resolved matches Package.swift
        # Every build uses the versions the committed Package.resolved names,
        # and one made from another Package.swift, or without the smoke test's
        # package, would have every build rewrite it (docs/ci.md "Dependency
        # updates"). Read from the two files, in a second.
        run: scripts/check-package-resolved.sh
      - name: Test
        # make test, as people and local validation run it: swift test, then
        # the check that a build without the ControlAPI trait carries no
        # control API, on the debug Athina the tests' build already made, so
        # this job compiles the package once (scripts/test.sh). The
        # development bundle, which must carry it, is test-e2e's to build and
        # check. The suite runs on a test clock and takes seconds once built;
        # a wait that never ends fails the job here rather than at the
        # six-hour limit.
        timeout-minutes: 20
        run: make test
      - name: The build left Package.resolved as committed
        # What the check above stands in for, on this job's own SwiftPM,
        # which resolved the package for the tests' build.
        run: git diff --exit-code -- Package.resolved

  lint:
    # Google's Swift style (docs/code-style.md): swift-format from the Xcode
    # that .xcode-version pins checks every Swift file against the committed
    # .swift-format and fails on any finding, then every relative link and
    # anchor in the Markdown resolves (scripts/lint.sh). Then the drift check:
    # the rules GitHub enforces on main against the committed ruleset. Never
    # skipped, so a docs-only pull request gets its links checked.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/select-xcode
      - name: Lint
        # The Swift style, then the Markdown links, checked after a style
        # failure too so both are reported at once.
        timeout-minutes: 15
        run: make lint
      - name: The checks GitHub requires on main match .github/rulesets/main.json
        # GitHub never reads the file, which is applied by hand
        # (docs/ci.md), so this reads the live rules and fails
        # when their required checks differ, including on a pull request that changes the file
        # until its ruleset is applied. It runs after a lint failure too, so
        # both are reported at once.
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-ruleset.sh

  test-e2e:
    # Every API-tier scenario of the end-to-end harness, the Swift Testing
    # tests in Tests/E2EAPITests, each launching a hermetic replay and driving
    # it through the app's control API, run twice, then their checkpoints
    # compared with the approved baselines in Tests/Checkpoints as
    # snapshots compares a snapshot (docs/ci.md "Checkpoints"). The app is launched through
    # LaunchServices (--launch open): exec'd from this job's shell, which the
    # runner image grants Accessibility, it would inherit the grant, and the
    # run could never catch a change that made the API tier need one. Below
    # the top of a stack the scenarios run once and no checkpoint is compared
    # or published.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    runs-on: macos-26
    env:
      SKIP_SCREENSHOTS: ${{ needs.changes.result == 'success' && needs.changes.outputs.screenshots == 'skip' && github.run_attempt == 1 }}
      SKIP_REASON: ${{ needs.changes.outputs.screenshots-reason }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/select-xcode
      - name: Hide the Dock
        # The runner's display is 1024 by 768, and with the Dock showing, the
        # tallest Settings panes are taller than the room left, so macOS cuts
        # the window off above their end and their last rows cannot be
        # scrolled into view. System Events hides it at once. Should it ever
        # refuse, the Dock is restarted hidden instead, which can take two
        # minutes, so this goes first and is waited for after the build.
        timeout-minutes: 2
        run: |
          if ! osascript -e 'tell application "System Events" to set autohide of dock preferences to true'; then
            defaults write com.apple.dock autohide -bool true
            killall Dock
          fi
      - name: Install bash 4 or newer
        # The harness, which builds and runs the tests, needs it, and macOS
        # ships 3.2 as /bin/bash.
        run: brew install bash
      - name: Let the hermetic copy record its own windows
        # Screen Recording for the API tier's copy of the app, which the
        # harness makes under this identifier, so a checkpoint is captured
        # with ScreenCaptureKit, glass, title bar and toolbar included, as
        # snapshots captures a snapshot. Only Screen Recording: an
        # Accessibility grant is what the launch through open keeps away.
        run: |
          sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" \
            "insert or replace into access (service, client, client_type, auth_value, auth_reason, auth_version, flags) values ('kTCCServiceScreenCapture', 'com.ahcarpenter.athina.e2e', 0, 2, 4, 1, 0)"
      - uses: ./.github/actions/swiftpm-cache
        with:
          name: test-e2e
      - name: Build the app bundle
        # The development bundle, built with the ControlAPI trait, so it must
        # carry the control API; test checks that a build without the trait
        # carries none (docs/e2e.md "The control API").
        run: |
          scripts/bundle.sh release
          if scripts/check-no-control-api.sh build/Athina.app/Contents/MacOS/Athina; then
            echo "the development bundle should carry the control API" >&2
            exit 1
          fi
      - name: Wait for the Dock to hide
        # Fails rather than run the scenarios with the Dock showing.
        run: |
          for _ in $(seq 1 60); do
            room="$(swift -e 'import AppKit; print(Int(NSScreen.main?.visibleFrame.height ?? 0))' 2>/dev/null || echo 0)"
            echo "the display has ${room} points of height to lay windows out in"
            [ "$room" -ge 728 ] && exit 0
            sleep 2
          done
          echo "::error::The Dock never hid, so the tallest Settings panes would be cut off." >&2
          exit 1
      - name: Run the API tier twice and compare its checkpoints with their baselines
        if: env.SKIP_SCREENSHOTS != 'true'
        # The first run compiles the tests, with the E2EAPI trait in a build
        # directory of their own under .build, which the cache keeps.
        timeout-minutes: 30
        run: scripts/snapshots.sh checkpoints --launch open
      - name: Run the API tier without comparing its checkpoints
        # The same scenarios, launched the same way, so only the screenshot
        # test is skipped: a failed scenario still fails the job.
        if: env.SKIP_SCREENSHOTS == 'true'
        timeout-minutes: 30
        run: |
          echo "Skipped the checkpoint comparison: $SKIP_REASON. The scenarios still run. To compare the checkpoints on this commit, re-run all jobs." | tee -a "$GITHUB_STEP_SUMMARY"
          scripts/e2e/athina-e2e run --tier api --jobs 4 --launch open --out "$PWD/build/checkpoints/runs/functional" all
      - name: Summarize
        if: always()
        run: |
          for summary in build/checkpoints/determinism/summary.md build/checkpoints/report/summary.md; do
            if [ -f "$summary" ]; then cat "$summary" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - name: Upload the checkpoints
        # What `make snapshots-approve` fetches to approve a checkpoint drift.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checkpoints
          path: build/checkpoints/render
          if-no-files-found: ignore
      - name: Upload the drift report and the runs' evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checkpoints-report
          path: |
            build/checkpoints/report
            build/checkpoints/determinism
            build/checkpoints/runs
          if-no-files-found: ignore

  snapshots-smoke:
    # The fast UI check, and the check the main ruleset requires: draws every
    # snapshot in the test process with swift-snapshot-testing and compares
    # each with its reference image, recorded on this image with the pinned
    # Xcode as the snapshots baselines were (docs/ci.md "UI snapshot smoke
    # test"). One runner: most of the job is fetching and compiling, which the
    # build cache cuts to what changed, and drawing every image takes about a
    # minute, where four runners each compiled it again. Below the top of a
    # stack it draws nothing and passes on Ubuntu, saying why, rather than be a
    # skipped job, which has no summary, or hold a macOS runner.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ${{ (needs.changes.result == 'success' && needs.changes.outputs.screenshots == 'skip' && github.run_attempt == 1) && 'ubuntu-latest' || 'macos-26' }}
    env:
      SKIP_SCREENSHOTS: ${{ needs.changes.result == 'success' && needs.changes.outputs.screenshots == 'skip' && github.run_attempt == 1 }}
      SKIP_REASON: ${{ needs.changes.outputs.screenshots-reason }}
    steps:
      - name: Say why the screenshot test is skipped
        if: env.SKIP_SCREENSHOTS == 'true'
        run: |
          echo "Skipped: $SKIP_REASON, so no snapshot was drawn. To draw them on this commit, re-run all jobs." | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v7
        if: env.SKIP_SCREENSHOTS != 'true'
      - uses: ./.github/actions/select-xcode
        if: env.SKIP_SCREENSHOTS != 'true'
      - uses: ./.github/actions/swiftpm-cache
        if: env.SKIP_SCREENSHOTS != 'true'
        with:
          name: snapshots-smoke
      - name: Draw every snapshot and compare with its reference
        if: env.SKIP_SCREENSHOTS != 'true'
        timeout-minutes: 20
        run: make snapshots-smoke
      - name: Summarize
        if: always()
        run: |
          if [ -f build/snapshots-smoke/summary.md ]; then
            cat build/snapshots-smoke/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload the approvable set
        # What `make snapshots-approve` fetches to approve a smoke drift.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: snapshots-smoke-set
          path: build/snapshots-smoke/references
          if-no-files-found: ignore
      - name: Upload the drift report
        # The reference, the new render and their difference, one folder per
        # drifted snapshot.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: snapshots-smoke-report
          path: build/snapshots-smoke/drift
          if-no-files-found: ignore
